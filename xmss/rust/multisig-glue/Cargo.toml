[package]
name = "multisig-glue"
version = "0.1.0"
edition = "2021"

[dependencies]
# leanVM main HEAD. The root crate re-exports the aggregation API, Xmss
# key/signature types, and setup_prover/setup_verifier (which own the internal
# arena allocator; no global_allocator override). XMSS is now internalized here
# (leanSig is gone), so this rev must match hashsig-glue's `xmss` pin exactly.
#
# PLACEHOLDER REV: swap for the frozen devnet rev once the interop group agrees
# one. Aggregate wire format changed vs e2592df (compress/decompress_without_pubkeys
# → to_bytes/from_bytes_without_pubkeys; info.without_pubkeys → info.core).
lean-multisig = { git = "https://github.com/leanEthereum/leanVM.git", rev = "380da82c330eac2841252a655a86ea48ec173bb6" }
# split-by-message is not re-exported by the root crate; pull it from the
# aggregation crate directly (same git rev, identical re-exported types).
rec_aggregation = { git = "https://github.com/leanEthereum/leanVM.git", rev = "380da82c330eac2841252a655a86ea48ec173bb6" }
# Poseidon permutation primitives for the spec test-vector FFI (poseidon_permute_*).
backend = { git = "https://github.com/leanEthereum/leanVM.git", rev = "380da82c330eac2841252a655a86ea48ec173bb6" }

[lib]
# Built as an rlib so its `#[no_mangle] pub extern "C"` symbols can be
# funnelled through the `cgo-glue` staticlib shim. See cgo-glue/Cargo.toml.
crate-type = ["rlib"]
name = "multisig_glue"
